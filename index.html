
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fafafa">
  <meta name="description" content="紅水堂 KUREMIZUDOH">
  <title>紅水堂 | KUREMIZUDOH</title>
  <style>
    :root { --paper:#fafafa; --ink:#252525; --accent:#873c38; --sub:#777; --line:#e7e4e1; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif; }
    a { color:inherit; text-decoration:none; }
    a:hover, a:focus-visible { color:var(--accent); }
    .wrap { width:min(900px, calc(100% - 48px)); margin-inline:auto; }
    header { display:flex; align-items:center; justify-content:space-between; gap:20px; padding:28px 0; border-bottom:1px solid var(--line); }
    .wordmark { font-size:20px; font-weight:600; letter-spacing:.18em; white-space:nowrap; }
    nav { display:flex; gap:22px; flex-wrap:wrap; font:11px/1.7 Georgia,serif; letter-spacing:.11em; }
    .hero { min-height:66vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:90px 0 110px; }
    .roman { font:12px/1.5 Georgia,serif; color:var(--accent); letter-spacing:.34em; padding-left:.34em; }
    h1 { font-size:clamp(44px,8vw,80px); font-weight:400; letter-spacing:.24em; padding-left:.24em; margin:27px 0 25px; line-height:1.4; }
    .ornament { color:var(--accent); font-size:16px; opacity:.8; }
    section { border-top:1px solid var(--line); padding:47px 0 56px; }
    h2 { font:13px/1.6 Georgia,serif; letter-spacing:.24em; color:var(--accent); margin:0 0 25px; }
    .links { display:flex; flex-wrap:wrap; gap:16px 38px; line-height:2; }
    .links a { border-bottom:1px solid var(--line); padding-bottom:3px; }
    .muted { color:var(--sub); font-size:13px; line-height:2; margin:0; }
    footer { padding:38px 0 50px; color:var(--sub); font:11px Georgia,serif; letter-spacing:.18em; text-align:center; border-top:1px solid var(--line); }
    @media(max-width:640px) { header { flex-direction:column; } nav { justify-content:center; gap:10px 18px; } .hero { min-height:55vh; padding:80px 0; } section { padding:36px 0 45px; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="wordmark" href="#home">紅水堂</a>
      <nav aria-label="Main navigation">
        <a href="#works">WORKS</a>
        <a href="#creations">CREATIONS</a>
        <a href="#diary">DIARY</a>
        <a href="#gallery">GALLERY</a>
        <a href="#about">ABOUT</a>
      </nav>
    </header>
    <main id="home">
      <div class="hero">
        <div class="roman">KUREMIZUDOH</div>
        <h1>紅水堂</h1>
        <span class="ornament" aria-hidden="true">◆</span>
      </div>
      <section id="works"><h2>WORKS</h2><p class="muted">Coming soon.</p></section>
      <section id="creations"><h2>CREATIONS</h2><p class="muted">Coming soon.</p></section>
      <section id="diary"><h2>DIARY</h2><p class="muted">Coming soon.</p></section>
      <section id="gallery"><h2>GALLERY</h2><p class="muted">Coming soon.</p></section>
      <section id="about"><h2>ABOUT</h2><div class="links"><a href="https://x.com/kuremizudoh" target="_blank" rel="noopener noreferrer">X</a><a href="https://kuremizudoh.tumblr.com/about" target="_blank" rel="noopener noreferrer">TUMBLR</a></div></section>
    </main>
    <footer>© KUREMIZUDOH</footer>
  </div>
</body>
</html>
